<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172014">
<title>WiDo 2027</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172014}
.backdrop{position:fixed;inset:-5vmax;background-position:center;background-size:cover;background-repeat:no-repeat;filter:blur(24px) brightness(.82);transform:scale(1.1)}
.stage{position:fixed;left:50%;top:50%;width:min(100vw,56.25vh);height:min(177.78vw,100vh);transform:translate(-50%,-50%);overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.28)}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;touch-action:none}
.pull-indicator{position:absolute;z-index:6;top:12px;left:50%;transform:translate(-50%,-140%);opacity:0;pointer-events:none;border-radius:999px;padding:9px 15px;background:rgba(12,20,22,.84);color:white;font:600 13px -apple-system,BlinkMacSystemFont,Arial,sans-serif;transition:transform .18s ease,opacity .18s ease;white-space:nowrap}
.pull-indicator.visible{opacity:1;transform:translate(-50%,0)}
.photo.changing{opacity:.4;transition:opacity .18s ease}
.photo{transition:opacity .18s ease}
.number{position:absolute;left:64.0%;top:33.55%;transform:translate(-50%,-50%);color:#050505;font-family:"Arial Narrow","Helvetica Neue Condensed",Arial,Helvetica,sans-serif;font-size:calc(min(100vw,56.25vh)*.073);font-weight:850;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.player{position:absolute;z-index:6;bottom:2%;left:3%;right:3%;padding:11px 12px;border-radius:17px;background:rgba(12,20,22,.76);color:white;font:13px -apple-system,BlinkMacSystemFont,Arial,sans-serif;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.track-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-size:14px;font-weight:650;margin-bottom:5px}
.controls{display:flex;align-items:center;justify-content:center;gap:clamp(6px,3vw,14px)}
.controls button{flex:0 0 42px;height:42px;border:1px solid #ffffff66;border-radius:50%;background:#ffffff18;color:white;font-size:18px;cursor:pointer}
.controls #playPause{flex-basis:48px;height:48px;background:rgba(255,255,255,.26);font-size:22px}
.progress-row{display:flex;align-items:center;gap:8px;margin:8px 0 5px;font-size:11px;font-variant-numeric:tabular-nums;color:#f0f0f0}
.progress-row span{min-width:34px;text-align:center}
.progress-row input{flex:1;min-width:0;width:100%;accent-color:#f0f0f0;cursor:pointer}
.progress-row input:disabled{opacity:.5}
.picker-wrap{position:relative;margin-top:8px}
.picker-wrap:after{content:"⌄";position:absolute;right:12px;top:50%;transform:translateY(-57%);font-size:21px;font-weight:700;color:white;pointer-events:none}
.picker-caption{font-size:10px;color:#ffffffb8;margin-bottom:3px;text-align:left}
@media(max-width:350px){.player{padding:8px}.controls{gap:6px}}
.track-picker{appearance:none;-webkit-appearance:none;width:100%;border-radius:9px;padding:10px 34px 10px 11px;background:#ffffff21;color:white;border:1px solid #ffffff66;font-weight:600;font-size:13px;cursor:pointer;text-overflow:ellipsis}.track-picker option{background:#26302d;color:white}
.player button:focus-visible,.track-picker:focus-visible{outline:2px solid white;outline-offset:2px}

/* Ruhige iOS-inspirierte Symbole statt Emoji; Countdown und Bild bleiben unverändert. */
.controls button{display:grid;place-items:center;transition:background .2s,transform .2s;border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.13);-webkit-tap-highlight-color:transparent}
.controls button:active{transform:scale(.93);background:rgba(255,255,255,.30)}
.controls button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.controls #playPause svg{width:26px;height:26px}
.player{transition:opacity .32s ease,transform .32s ease,visibility .32s;transform-origin:bottom center}
.player.collapsed{opacity:0;transform:translateY(16px) scale(.96);visibility:hidden;pointer-events:none}
.show-player{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:10px 17px;min-height:42px;background:rgba(12,20,22,.68);color:#fff;font:600 13px -apple-system,BlinkMacSystemFont,Arial,sans-serif;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;white-space:nowrap}
.show-player[hidden]{display:none}
.quick-actions{position:absolute;z-index:7;bottom:2.2%;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:8px;max-width:96%;white-space:nowrap}
.quick-actions[hidden]{display:none}
.new-image{border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:10px 13px;min-height:42px;background:rgba(12,20,22,.68);color:#fff;font:600 13px -apple-system,BlinkMacSystemFont,Arial,sans-serif;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;white-space:nowrap}
.new-image:disabled{opacity:.55;cursor:wait}
.new-image:focus-visible{outline:2px solid white;outline-offset:3px}
.show-player:focus-visible{outline:2px solid white;outline-offset:3px}
@media(prefers-reduced-motion:reduce){.player,.controls button{transition:none}}
</style>
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<main class="stage" aria-label="WiDo 2027 Countdown">
<img class="photo" id="photo" alt="Wickersdorf 2027">
<div class="pull-indicator" id="pullIndicator" role="status" aria-live="polite">Nach unten ziehen: neues Bild</div>
<span class="number" id="days" aria-live="polite">…</span>
<audio id="music" preload="none"></audio>
<section class="player" id="player" aria-label="Musiksteuerung">
<div class="track-title" id="trackTitle">Musik wird gesucht …</div>
<div class="controls">
<button id="previous" type="button" aria-label="Vorheriger Titel" title="Vorheriger Titel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14M19 6l-12 6 12 6z"/></svg></button>
<button id="playPause" type="button" aria-label="Abspielen" title="Abspielen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
<button id="next" type="button" aria-label="Nächster Titel" title="Nächster Titel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14M5 6l12 6-12 6z"/></svg></button>
<button id="muteToggle" type="button" aria-label="Stumm schalten" title="Stumm schalten"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5zM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg></button>
</div>
<div class="progress-row"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Wiedergabeposition" disabled><span id="duration">–:––</span></div>
<div class="picker-wrap"><div class="picker-caption">TITEL AUSWÄHLEN</div><select id="trackPicker" class="track-picker" aria-label="Titel auswählen – Liste öffnen"><option>Musik wird gesucht …</option></select></div>
</section>
<div class="quick-actions" id="quickActions" hidden>
<button id="showPlayer" class="show-player" type="button" aria-label="Musiksteuerung einblenden" title="Musiksteuerung einblenden">♫ <span>Musik</span> <span aria-hidden="true">⌃</span></button>
<button id="newImage" class="new-image" type="button" aria-label="Neues Zufallsbild laden" title="Neues Zufallsbild laden">↻ Neues Bild</button>
</div>
</main>
<script>
const TARGET=new Date("2027-09-17T00:00:00+02:00");
function update(){const d=TARGET.getTime()-Date.now();const days=d<=0?0:Math.ceil(d/86400000);document.getElementById("days").textContent=days.toLocaleString("de-DE")}
update();setInterval(update,30000);
const $=id=>document.getElementById(id);
const audio=$("music"),play=$("playPause"),mute=$("muteToggle"),picker=$("trackPicker"),title=$("trackTitle");
const owner=location.hostname.split(".")[0],repo=location.pathname.split("/").filter(Boolean)[0];
const apiRoot=`https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`;
let tracks=[],current=-1,loading=null;

async function getJson(url){
 const r=await fetch(url+(url.includes("?")?"&":"?")+"_="+Date.now(),{cache:"no-store",headers:{Accept:"application/vnd.github+json"}});
 if(!r.ok)throw Error("GitHub-Antwort: "+r.status);return r.json()
}
function clock(s){if(!Number.isFinite(s)||s<0)return "–:––";s=Math.floor(s);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function renderProgress(){
 const valid=Number.isFinite(audio.duration)&&audio.duration>0;
 $("elapsed").textContent=clock(audio.currentTime||0);
 $("duration").textContent=valid?clock(audio.duration):"–:––";
 $("seek").disabled=!valid;
 if(!seeking)$("seek").value=valid?Math.round(audio.currentTime/audio.duration*1000):0;
}
let seeking=false;
function render(){
 play.innerHTML=audio.paused?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>';
 mute.innerHTML=audio.muted||audio.volume===0?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5zM16 9l5 6m0-6-5 6"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5zM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg>';
 play.setAttribute("aria-label",audio.paused?"Abspielen":"Pausieren");
 title.textContent=current<0?"Keine MP3 gefunden":tracks[current].name.replace(/\.mp3$/i,"");
 picker.value=String(current);renderProgress()
}
function setTrack(i,autoplay=false){
 if(!tracks.length)return;
 current=(i+tracks.length)%tracks.length;
 audio.src=tracks[current].url;audio.load();renderProgress();render();
 if(autoplay)audio.play().catch(e=>console.warn("Audiostart:",e))
}
async function findTracks(){
 let entries=[];
 try{
  const files=await getJson(apiRoot+"/contents");
  if(!Array.isArray(files))throw Error("Keine Dateiliste");
  entries=files.filter(f=>f.type==="file"&&/\.mp3$/i.test(f.name)).map(f=>({name:f.name,url:f.download_url}))
 }catch(e){console.warn("Contents-Abfrage:",e)}
 if(!entries.length){
  const tree=await getJson(apiRoot+"/git/trees/HEAD?recursive=1");
  entries=(tree.tree||[]).filter(f=>f.type==="blob"&&!f.path.includes("/")&&/\.mp3$/i.test(f.path)).map(f=>({name:f.path,url:`https://raw.githubusercontent.com/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/HEAD/${f.path.split("/").map(encodeURIComponent).join("/")}`}))
 }
 return entries.sort((a,b)=>a.name.localeCompare(b.name,"de"))
}
async function loadTracks(){
 if(loading)return loading;
 loading=(async()=>{
  try{
   tracks=await findTracks();picker.innerHTML="";
   if(!tracks.length){picker.add(new Option("Keine MP3 gefunden","-1"));render();return false}
   tracks.forEach((t,i)=>picker.add(new Option(t.name.replace(/\.mp3$/i,""),String(i))));
   setTrack(Math.floor(Math.random()*tracks.length));return true
  }catch(e){console.warn("MP3-Suche:",e);title.textContent="Musik nicht gefunden – ▶ erneut versuchen";return false}
  finally{loading=null}
 })();
 return loading
}
play.addEventListener("click",async()=>{
 if(!tracks.length){if(!await loadTracks())return}
 if(audio.paused){try{await audio.play()}catch(e){console.warn("Audiostart:",e)}}
 else audio.pause();render()
});
$("previous").addEventListener("click",async()=>{if(!tracks.length&&!(await loadTracks()))return;setTrack(current-1,true)});
$("next").addEventListener("click",async()=>{if(!tracks.length&&!(await loadTracks()))return;setTrack(current+1,true)});
picker.addEventListener("change",()=>setTrack(Number(picker.value),true));
mute.addEventListener("click",()=>{audio.muted=!audio.muted;render()});
const seek=$("seek");
seek.addEventListener("pointerdown",()=>{seeking=true});
seek.addEventListener("pointerup",()=>{seeking=false;renderProgress()});
seek.addEventListener("change",()=>{seeking=false;renderProgress()});
seek.addEventListener("input",e=>{
 if(Number.isFinite(audio.duration)&&audio.duration>0){audio.currentTime=audio.duration*Number(e.target.value)/1000;$("elapsed").textContent=clock(audio.currentTime)}
});
["timeupdate","loadedmetadata","durationchange","seeking","seeked"].forEach(e=>audio.addEventListener(e,renderProgress));
["play","pause","ended","volumechange"].forEach(e=>audio.addEventListener(e,render));

/* Automatisch nach 6 Sekunden einklappen; jede Interaktion im Player setzt den Timer zurück. */
const player=$("player"), showPlayer=$("showPlayer"), quickActions=$("quickActions"), newImage=$("newImage");
let hideTimer=null;
function collapsePlayer(){
 if(player.matches(":focus-within")||seeking){scheduleHide();return}
 player.classList.add("collapsed");quickActions.hidden=false;
}
function scheduleHide(){clearTimeout(hideTimer);hideTimer=setTimeout(collapsePlayer,6000)}
function expandPlayer(){player.classList.remove("collapsed");quickActions.hidden=true;scheduleHide()}
showPlayer.addEventListener("click",e=>{e.stopPropagation();expandPlayer()});
$("photo").closest(".stage").addEventListener("click",e=>{
 if(player.contains(e.target)||quickActions.contains(e.target))return;
 if(player.classList.contains("collapsed") && !e.defaultPrevented)expandPlayer();
});
player.addEventListener("pointerdown",scheduleHide);
player.addEventListener("change",scheduleHide);
player.addEventListener("focusin",()=>clearTimeout(hideTimer));
player.addEventListener("focusout",scheduleHide);
scheduleHide();

// Bilderwechsel ohne Seitenreload: Der Audio-Player bleibt vollständig unberührt.
let imagesCache=[], lastImageName="", imageBusy=false, gesture=null;
const photo=$("photo"), backdrop=$("backdrop"), indicator=$("pullIndicator");
function indicatorText(text,visible=true){
 indicator.textContent=text;
 indicator.classList.toggle("visible",visible);
}
async function changeImage(){
 if(imageBusy)return;
 imageBusy=true;
 newImage.disabled=true;
 indicatorText("Neues Bild wird geladen …");
 try{
  // Bei jedem Wechsel aktuelle Bildliste abfragen, damit neue Uploads erkannt werden.
  const files=await getJson(apiRoot+"/contents");
  imagesCache=files.filter(f=>f.type==="file"&&/\.(jpe?g|png|webp)$/i.test(f.name)&&f.download_url);
  if(!imagesCache.length)throw Error("Keine Bilder gefunden");
  const candidates=imagesCache.length>1?imagesCache.filter(f=>f.name!==lastImageName):imagesCache;
  const chosen=candidates[Math.floor(Math.random()*candidates.length)];
  const url=chosen.download_url+(chosen.download_url.includes("?")?"&":"?")+"v="+Date.now();
  const preload=new Image();
  await new Promise((resolve,reject)=>{
   preload.onload=resolve;
   preload.onerror=()=>reject(Error("Bild konnte nicht geladen werden"));
   preload.src=url;
  });
  photo.classList.add("changing");
  photo.src=url;
  backdrop.style.backgroundImage=`url("${url}")`;
  lastImageName=chosen.name;
  requestAnimationFrame(()=>requestAnimationFrame(()=>photo.classList.remove("changing")));
  indicatorText("Neues Bild geladen");
 }catch(e){
  console.error("Bildwechsel:",e);
  indicatorText("Bildwechsel fehlgeschlagen – erneut versuchen");
 }finally{
  imageBusy=false;
  newImage.disabled=false;
  setTimeout(()=>{if(!gesture&&!imageBusy)indicator.classList.remove("visible")},1600);
 }
}
newImage.addEventListener("click",e=>{e.stopPropagation();changeImage()});
const stage=photo.closest(".stage");
stage.addEventListener("touchstart",e=>{
 if(e.touches.length!==1||imageBusy||e.target.closest(".player,.quick-actions"))return;
 gesture={x:e.touches[0].clientX,y:e.touches[0].clientY,dy:0,cancelled:false};
},{passive:true});
stage.addEventListener("touchmove",e=>{
 if(!gesture)return;
 if(e.touches.length!==1){gesture.cancelled=true;return}
 const dx=e.touches[0].clientX-gesture.x,dy=e.touches[0].clientY-gesture.y;
 if(Math.abs(dx)>Math.abs(dy)*1.2&&Math.abs(dx)>18){gesture.cancelled=true;return}
 if(gesture.cancelled)return;
 gesture.dy=dy;
 if(dy>12){
  if(e.cancelable)e.preventDefault();
  indicatorText(dy>=75?"Loslassen: neues Bild":"Weiter nach unten ziehen");
 }else indicator.classList.remove("visible");
},{passive:false});
stage.addEventListener("touchend",()=>{
 if(!gesture)return;
 const shouldChange=!gesture.cancelled&&gesture.dy>=75;
 gesture=null;
 if(shouldChange)changeImage();
 else indicator.classList.remove("visible");
},{passive:true});
stage.addEventListener("touchcancel",()=>{gesture=null;indicator.classList.remove("visible")},{passive:true});

loadTracks().then(ok=>{if(ok)audio.play().catch(()=>render())});
changeImage();
</script>
</body></html>
