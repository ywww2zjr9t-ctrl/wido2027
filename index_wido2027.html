<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172014">
<title>WiDo 2027</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#172014}
.backdrop{position:fixed;inset:-5vmax;background:url("wickersdorf.jpg") center/cover no-repeat;filter:blur(24px) brightness(.82);transform:scale(1.1)}
.stage{position:fixed;left:50%;top:50%;width:min(100vw,56.25vh);height:min(177.78vw,100vh);transform:translate(-50%,-50%);overflow:hidden;box-shadow:0 0 30px rgba(0,0,0,.28)}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.number{
 position:absolute;
 left:64.0%;
 top:33.55%;
 transform:translate(-50%,-50%);
 color:#050505;
 font-family:"Arial Narrow","Helvetica Neue Condensed",Arial,Helvetica,sans-serif;
 font-size:calc(min(100vw,56.25vh)*.073);
 font-weight:850;line-height:1;letter-spacing:-.04em;
 font-variant-numeric:tabular-nums;white-space:nowrap;
}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>
<main class="stage" aria-label="WiDo 2027 Countdown">
<img class="photo" src="wickersdorf.jpg" alt="Wickersdorf 2027">
<span class="number" id="days" aria-live="polite">…</span>
</main>
<script>
const TARGET=new Date("2027-09-17T00:00:00+02:00");
function update(){
 const d=TARGET.getTime()-Date.now();
 const days=d<=0?0:Math.ceil(d/86400000);
 document.getElementById("days").textContent=days.toLocaleString("de-DE");
}
update();setInterval(update,30000);
</script>
</body>
</html>
